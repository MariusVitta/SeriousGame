<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Quiz - Aide à domicile</title>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <section id="quiz" aria-labelledby="quiz-title">
      <a href="./index.html" aria-label="Retour à l'accueil">
        <h1 id="quiz-title"><span>Q</span>uiz <i class="far fa-question-circle" aria-hidden="true"></i></h1>
      </a>

      <h2 id="question"></h2>
      <h3 id="score"></h3>

      <div class="choices" aria-label="Réponses possibles">
        <button id="guess0" class="btn" type="button">
          <span id="choice0"></span>
        </button>
        <button id="guess1" class="btn" type="button">
          <span id="choice1"></span>
        </button>
        <button id="guess2" class="btn" type="button">
          <span id="choice2"></span>
        </button>
      </div>

      <p id="progress"></p>
    </section>
  </main>

  <script src="./js/core/quiz-core.js" type="text/javascript"></script>
  <script src="./js/aide-domicile.js" type="text/javascript"></script>
</body>
</html>
